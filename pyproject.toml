[project]
name = "argon-video-engine"
version = "0.1.0"
description = "Autonomous Multi-Agent Adobe Video Production Engine powered by Nvidia NIM, Faster-Whisper, and Live CEP Bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "mcp>=1.0.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
vision = [
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "scenedetect>=0.6.2",
]
ml = [
    "openai>=1.20.0",
    "chromadb>=0.4.22",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
